<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div id="app"></div>
  <script src="bundle.js"></script>
</body>
</html>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      margin: 0;
      background: #f4f5f7;
    }

    .container {
      padding: 10px;
      background: #fff;
      border-bottom: 2px solid #0052cc;
    }

    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .dropdown {
      position: relative;
      min-width: 150px;
    }

    .dropdown-btn {
      width: 100%;
      padding: 6px;
      border: 1px solid #dfe1e6;
      background: #fff;
      cursor: pointer;
      text-align: left;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      background: #fff;
      border: 1px solid #dfe1e6;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 10;
    }

    .dropdown-menu div {
      padding: 6px;
      cursor: pointer;
    }

    .dropdown-menu div:hover {
      background: #deebff;
    }

    .tags {
      margin-top: 10px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      margin: 3px;
      background: #0052cc;
      color: white;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="filter-bar">
    <div id="projectFilter"></div>
    <div id="statusFilter"></div>
    <div id="assigneeFilter"></div>
  </div>

  <div class="tags" id="smartFilters"></div>
</div>

<script src="app.js"></script>
</body>
</html>
